[functions.invoice-portal]
verify_jwt = false

[functions.invite-tenant]
verify_jwt = false

[functions.meter-reading-ocr]
verify_jwt = false

[functions.tenant-profile-invitation]
verify_jwt = false

[functions.admin-console]
verify_jwt = true

[functions.platform-event]
verify_jwt = false

[functions.tenant-lifecycle]
verify_jwt = false

[auth]
site_url = "https://homeops360.app"
additional_redirect_urls = ["https://facility-billing-management.pages.dev/**", "https://homeops360.app/**", "https://admin.homeops360.app/**"]

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_confirmations = true
max_frequency = "1m"
otp_length = 6
otp_expiry = 600

[auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(HOMEOPS360_SMTP_PASS)"
admin_email = "no-reply@auth.homeops360.app"
sender_name = "HomeOps360"

[auth.email.template.magic_link]
subject = "Your HomeOps360 administrator login code"
content_path = "./supabase/templates/admin_login_otp.html"

[storage.vector]
enabled = false
