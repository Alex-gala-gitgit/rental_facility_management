<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HomeOps360 administrator login</title>
  </head>
  <body style="margin:0;background:#f4f7fb;font-family:Arial,Helvetica,sans-serif;color:#13213a;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f7fb;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border-radius:20px;overflow:hidden;box-shadow:0 10px 30px rgba(19,33,58,.08);">
            <tr>
              <td style="padding:28px 32px;background:linear-gradient(135deg,#2f80ed,#16b8b0);color:#ffffff;">
                <div style="font-size:24px;font-weight:700;">HomeOps360</div>
                <div style="margin-top:6px;font-size:14px;opacity:.9;">Secure administration</div>
              </td>
            </tr>
            <tr>
              <td style="padding:32px;">
                <h1 style="margin:0 0 12px;font-size:24px;line-height:1.3;">Your administrator login code</h1>
                <p style="margin:0 0 24px;color:#65728a;font-size:16px;line-height:1.6;">Enter this six-digit code on the HomeOps360 administrator sign-in page.</p>
                <div style="padding:20px;border-radius:14px;background:#eef5ff;text-align:center;font-size:34px;font-weight:700;letter-spacing:10px;color:#1769d2;">{{ .Token }}</div>
                <p style="margin:24px 0 0;color:#65728a;font-size:14px;line-height:1.6;">This code expires in 10 minutes and can only be used once. If you did not request it, you can safely ignore this email.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
