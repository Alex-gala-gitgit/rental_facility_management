name: Keep Supabase projects active

on:
  schedule:
    # Supabase says a few database requests per day are typically sufficient
    # for a Free project. Use non-zero minutes to reduce scheduler congestion.
    - cron: "17 0,8,16 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: true

jobs:
  keep-active:
    name: Keep ${{ matrix.project.name }} active
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        project:
          - name: HomeOps360 UAT
            url: https://yvyvbjtgfmpvvbnmzinq.supabase.co
            publishable_key: sb_publishable_0rPCSgL94fhHr9gVgAzqQQ_FHuFtwvD
          - name: HomeOps360 production
            url: https://poftsyskfuyeznbzxpow.supabase.co
            publishable_key: sb_publishable_n4Hudhh3uiUNxaYLkV8XKQ_UWUbIrB0
    steps:
      - uses: actions/checkout@v4
      - name: Record read-only database activity
        env:
          SUPABASE_PROJECT_NAME: ${{ matrix.project.name }}
          SUPABASE_URL: ${{ matrix.project.url }}
          # Publishable keys identify public clients and contain no service
          # privileges. Row-level security still applies to every query.
          SUPABASE_PUBLISHABLE_KEY: ${{ matrix.project.publishable_key }}
        run: node tool/keep_supabase_active.mjs
